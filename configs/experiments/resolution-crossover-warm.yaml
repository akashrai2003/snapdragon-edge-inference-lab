experiment:
  id: "resolution-crossover-warm"
  name: "Workstream A (warm): Resolution sweep with projector warmup enabled"
  description: "Same sweep as resolution-crossover, but without --no-warmup so projector buffer allocation is not inside the encode timing"
  model_config: "configs/models/lfm3-vl-2b.yaml"
  device_config: "configs/devices/realme-gt8-pro.yaml"
  resolutions: [256, 384, 512, 768, 1024]
  configurations:
    - id: "gpu_lm_cpu_vision"
      name: "GPU LM + CPU Vision (Mixed)"
      ngl: 99
      device: "GPUOpenCL"
      mmproj_offload: false
      mmproj_device: null
    - id: "gpu_all"
      name: "GPU LM + GPU Vision"
      ngl: 99
      device: "GPUOpenCL"
      mmproj_offload: true
      mmproj_device: "GPUOpenCL"
  trials:
    warmup_runs: 1
    measured_repetitions: 5
    cooldown_seconds: 4.0
    randomize_order: true
    seed: 42
    threads: 4
    timeout_seconds: 180
    max_battery_temp_celsius: 42.0
    process_warmup: true
